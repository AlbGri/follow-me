<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Follow Me</title>
  <script>
    // l'indirizzo dell'app e' fm.albgri.com: chi arriva dal vecchio indirizzo GitHub viene rimandato li'
    if (location.hostname === 'albgri.github.io') location.replace('https://fm.albgri.com/' + location.search + location.hash);
  </script>
  <meta name="description" content="Map your trip day by day and share the route as text, link or image.">
  <!-- anteprima dei link nelle chat; vale anche per i link corti, che rimandano qui -->
  <meta property="og:title" content="Follow Me">
  <meta property="og:description" content="Disegna su mappa i giri di un viaggio, giorno per giorno, e condividili come testo, link o immagine.">
  <meta property="og:image" content="https://fm.albgri.com/icons/icon-512.png">
  <meta property="og:url" content="https://fm.albgri.com/">
  <meta property="og:type" content="website">
  <meta name="theme-color" content="#2f6fde">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@6.16.0/dist/maplibre-gl.css">
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="js/app.js"></script>
</head>
<body>
  <div class="layout">
    <aside class="panel">
      <header class="panel-header">
        <h1>Follow Me</h1>
        <div class="header-actions">
          <button id="install-app" type="button" data-i18n="install.button" hidden></button>
          <button id="language-toggle" type="button" class="language-toggle"></button>
        </div>
      </header>
      <p id="storage-notice" class="notice storage-notice" hidden></p>

      <div class="trip-bar">
        <select id="trip-select" data-i18n-title="trip.select"></select>
        <button id="trip-new" type="button" data-i18n="trip.new"></button>
        <button id="trip-delete" type="button" class="danger" data-i18n="trip.delete"></button>
      </div>
      <div class="trip-meta">
        <input id="trip-title" class="trip-title" data-i18n-placeholder="trip.titlePlaceholder">
        <input id="trip-start" class="trip-start" type="date" data-i18n-title="trip.startDate">
      </div>
      <div class="toolbar">
        <button id="import-text" type="button" data-i18n="action.importText"></button>
        <button id="export-text" type="button" data-i18n="action.exportText"></button>
        <button id="share-link" type="button" data-i18n="action.shareLink"></button>
        <button id="export-image" type="button" data-i18n="action.exportImage"></button>
      </div>

      <form id="search-form" class="search">
        <input id="search-input" type="search" data-i18n-placeholder="search.placeholder">
        <button type="submit" data-i18n="search.button"></button>
      </form>
      <ul id="search-results" class="search-results"></ul>
      <p id="status" class="status" aria-live="polite"></p>
      <div class="days-bar">
        <p class="hint" data-i18n="hint.click"></p>
        <button id="collapse-all" type="button" class="link-button"></button>
      </div>

      <div id="days" class="days"></div>
      <button id="day-add" type="button" data-i18n="day.add"></button>
    </aside>
    <main class="map-area">
      <div id="map" class="map"></div>
      <div id="day-filter" class="day-filter"></div>
    </main>
  </div>
  <dialog id="dialog" class="dialog"></dialog>
  <div id="toast" class="toast" role="status" hidden>
    <span id="toast-message"></span>
    <button id="toast-undo" type="button" data-i18n="undo.action"></button>
  </div>
</body>
</html>
